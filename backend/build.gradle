plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'kr.swax'
version = '0.1.0'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories { mavenCentral() }

configurations { reportConverter }

dependencies {
    reportConverter 'io.github.spah1879:hwp2hwpx:2026.8.31-jdk11'
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
    implementation 'org.eclipse.angus:angus-mail'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

tasks.register('staffAdmin', JavaExec) {
    classpath = files(sourceSets.main.output.classesDirs, sourceSets.main.resources.srcDirs) + configurations.runtimeClasspath
    mainClass = 'kr.swax.intake.StaffAdmin'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    standardInput = System.in
}

def frontend = file('../frontend')
def npm = System.getProperty('os.name').startsWith('Windows') ? ['cmd', '/d', '/c', 'npm.cmd'] : ['npm']

def installFrontend = tasks.register('installFrontend', Exec) {
    workingDir frontend
    commandLine npm + ['ci', '--no-audit', '--no-fund']
    inputs.files("${frontend}/package.json", "${frontend}/package-lock.json")
    outputs.file("${frontend}/node_modules/.package-lock.json")
}

def buildFrontend = tasks.register('buildFrontend', Exec) {
    dependsOn installFrontend
    workingDir frontend
    commandLine npm + ['run', 'build']
    inputs.dir("${frontend}/src")
    inputs.dir("${frontend}/scripts")
    inputs.files("${frontend}/index.html", "${frontend}/vite.config.ts", "${frontend}/tsconfig.json", "${frontend}/package.json", "${frontend}/package-lock.json")
    outputs.dir("${frontend}/dist")
}

tasks.named('processResources') {
    dependsOn buildFrontend
    from("${frontend}/dist") { into 'static' }
}

tasks.register('prepareReportConverter', Sync) {
    from configurations.reportConverter
    into layout.buildDirectory.dir('report-converter')
}
