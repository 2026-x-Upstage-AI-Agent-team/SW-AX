spring.application.name=swax-intake
server.address=127.0.0.1
server.port=${AWARDS_PORT:18765}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${AWARDS_DB_URL:jdbc:postgresql://127.0.0.1:55432/swax_intake}
spring.datasource.username=${AWARDS_DB_USER:swax}
spring.datasource.password=${AWARDS_DB_PASSWORD}
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=302MB
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-part-count=108
server.tomcat.max-part-header-size=4KB
server.tomcat.max-http-form-post-size=302MB
spring.jackson.property-naming-strategy=SNAKE_CASE
awards.gmail.directory=${AWARD_DATA_DIR:../var}
awards.gmail.address=${GMAIL_ADDRESS:}
awards.gmail.client-file=${AWARDS_GMAIL_CLIENT_FILE:}
awards.gmail.redirect-uri=${AWARDS_GMAIL_REDIRECT_URI:http://127.0.0.1:18765/api/settings/gmail/callback}
awards.review.worker-token=${AWARDS_REVIEW_WORKER_TOKEN:}
awards.review.lease-seconds=${AWARDS_REVIEW_LEASE_SECONDS:300}
awards.output.worker-token=${AWARDS_OUTPUT_WORKER_TOKEN:}
awards.output.lease-seconds=${AWARDS_OUTPUT_LEASE_SECONDS:300}
